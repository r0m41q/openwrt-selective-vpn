name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y busybox shellcheck
      - run: python -m pip install ruff==0.17.5
      - run: ruff check . && ruff format --check .
      - run: shellcheck -s sh scripts/build-release.sh
      - run: |
          find selective-vpn tests scripts -type f \( -name '*.sh' -o -name 'install.sh' -o -name 'control' -o -name 'supervise' -o -name 'signal-event' -o -name 'service-run' -o -name 'recovery-watch' -o -name 'rpc-bridge' \) -exec sh -n {} +
          sh -n install.sh
          busybox ash -n install.sh
          sh -n selective-vpn/files/etc/init.d/selective-vpn selective-vpn/files/etc/hotplug.d/iface/95-selective-vpn selective-vpn/files/etc/hotplug.d/openvpn/95-selective-vpn
      - run: sh tests/run.sh

  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev rsync zstd
      - run: |
          mkdir -p build
          openssl ecparam -name prime256v1 -genkey -noout -out build/check-key.pem
          sh scripts/build-release.sh --sign-key build/check-key.pem
          cd dist/v*
          sha256sum -c SHA256SUMS
